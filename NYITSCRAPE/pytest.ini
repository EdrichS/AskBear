[pytest]
# Run from the project folder:   python -m pytest -q
# Offline by default: tests/conftest.py blocks every network connection. The one live
# smoke test (marker "live") only runs with ASKBEAR_LIVE=1 (see tests/test_crawler.py).
testpaths = tests
# the package (project root) and the test helpers (tests/testkit.py) are importable
# whatever import mode or working directory pytest is started with
pythonpath = . tests
addopts = -ra --strict-markers
markers =
    live: talks to the real NYIT websites (skipped unless the environment variable ASKBEAR_LIVE=1)
xfail_strict = false
